<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <title>Crear Pedido | MJBE-BIKES</title>
</head>

<body>

<div class="container py-5">

    <div class="card shadow formulario">

        <div class="card-header bg-dark text-white text-center">
            <h2>Crear Pedido</h2>
        </div>

        <div class="card-body">

            <form id="formPedido">

                <!-- Cliente -->

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre del Cliente</label>
                        <input type="text" id="cliente" class="form-control" placeholder="Ingrese el nombre">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Documento</label>
                        <input type="number" id="documento" class="form-control" placeholder="Ingrese el documento">
                    </div>

                </div>

                <!-- Contacto -->

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="number" id="telefono" class="form-control" placeholder="Ingrese el teléfono">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dirección de Entrega</label>
                        <input type="text" id="direccion" class="form-control" placeholder="Ingrese la dirección">
                    </div>

                </div>

                <!-- Producto -->

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Categoría</label>

                        <select id="categoria" class="form-select">
                            <option>Bicicleta</option>
                            <option>Repuesto</option>
                            <option>Accesorio</option>
                        </select>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Producto</label>

                        <select id="producto" class="form-select">
                            <option>Bicicleta MTB Rin 29</option>
                            <option>Bicicleta Ruta</option>
                            <option>Cadena</option>
                            <option>Llanta</option>
                            <option>Casco</option>
                            <option>Pedales</option>
                            <option>Luces LED</option>
                            <option>Porta Caramañola</option>
                        </select>

                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" id="cantidad" class="form-control" value="1">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" id="precio" class="form-control" placeholder="$">
                    </div>

                </div>

                <!-- Pago -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Método de Pago</label>

                        <select class="form-select">

                            <option>Efectivo</option>
                            <option>Nequi</option>
                            <option>Daviplata</option>
                            <option>Tarjeta Débito</option>
                            <option>Tarjeta Crédito</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Observaciones</label>

                        <textarea id="observaciones" class="form-control" rows="2" placeholder="Escriba alguna observación"></textarea>

                    </div>

                </div>

                <div class="text-end">

                    <button type="submit" class="btn btn-success">
                        Guardar Pedido
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        Limpiar
                    </button>

                </div>

            </form>

            <hr class="my-5">

            <h3 class="text-center mb-4">
                Pedidos Registrados
            </h3>

            <div class="table-responsive">

                <table class="table table-hover table-bordered table-striped" id="tablaPedidos">

                    <thead class="table-dark">

                        <tr>

                            <th>Cliente</th>
                            <th>Documento</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Total</th>
                            <th>Dirección</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>

                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
